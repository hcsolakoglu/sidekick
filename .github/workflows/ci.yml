name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run surface:check
      - name: Packed-install smoke test
        shell: pwsh
        run: |
          $tarball = npm pack --silent
          $smoke = Join-Path $env:RUNNER_TEMP "sidekick-pack-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          npm install --prefix $smoke (Join-Path $PWD $tarball)
          npm exec --prefix $smoke -- sidekick --version
          npm exec --prefix $smoke -- sidekick --help
          $env:SIDEKICK_HOME = Join-Path $smoke "state"
          npm exec --prefix $smoke -- sidekick spawn mock ci-roundtrip --dir $smoke -- "hello from CI"
          $roundtrip = npm exec --prefix $smoke -- sidekick wait ci-roundtrip --timeout 10 --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $roundtrip.status -ne "done" -or $roundtrip.exitCode -ne 0) {
            throw "sidekick mock roundtrip failed: $($roundtrip | ConvertTo-Json -Compress)"
          }
